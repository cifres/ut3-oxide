[package]
name = "ut3_oxide"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false


[profile.release-fast]
inherits = "release"
codegen-units = 1
lto = "fat" 
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
lto = "fat" 
strip = "none"
opt-level = 3
panic = "abort"
debug = true
