[package]
name = "ut3_oxide"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10.0"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
rand = "0.9.0"

[[bench]]
name = "my_benchmark"
harness = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release-fast]
inherits = "release"
# codegen-units = 1
# lto = "thin" 
# strip = "debuginfo"
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
strip = "none"
opt-level = 3
panic = "abort"
debug = true
